[tool.poetry]
name = "gms-backend"
version = "0.1.0"
description = "Guest Management System Backend"
package-mode = false
authors = ["Precious Udoibok <preciousudoibok@gmail.com>"]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"

# API Framework
fastapi = ">=0.111.0,<1"
uvicorn = "^0.30.0"

# Data validation and settings
pydantic = ">=2.8,<3"
pydantic-settings = ">=2.3,<3"
email-validator = "^2.0.0.post2"

# Database
sqlmodel = "^0.0.22"
alembic = "^1.13.0"
psycopg2-binary = "^2.9.9"

# Authentication
bcrypt = ">=1.7.5,<6.0.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}

# File uploads / HTTP requests
python-multipart = "^0.0.6"
httpx = ">=0.24.1,<0.31.0"

# Environment variables
poetry-dotenv-plugin = "0.2.0"

# Background jobs (keep only if you plan emails/notifications/tasks)
celery = "^5.3.1"
redis = "^4.6.0"

# Utilities
tenacity = "^8.2.0"

# Testing data (optional)
faker = "^19.1.0"


[tool.poetry.group.dev.dependencies]

# Code quality
ruff = "^0.5.3"
mypy = "^1.4"
pre-commit = "^2.20"

# Testing
pytest = "^7.4.0"
pytest-asyncio = "0.19.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.1"
pytest-dotenv = "^0.5.2"
pytest-xdist = "^3.6.1"


[build-system]
requires = ["poetry>=1.2"]
build-backend = "poetry.masonry.api"


[tool.ruff]
extend-exclude = ["__pycache__", ".pytest_cache"]
line-length = 100


[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "E501"]